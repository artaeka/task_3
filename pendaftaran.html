<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Pendaftaran Peserta</h1>
    <p>Tugas Individu 3 - Pengembangan Aplikasi Web</p>
  </header>

  <div class="container">
    <div class="box">
      <h2>Form Pendaftaran</h2>

      <!--
        method="GET"  : data dikirim lewat URL (query string)
        action        : halaman tujuan (halaman detail)
        Atribut name pada tiap input = nama parameter pada query string.
        Contoh hasil URL:
        detail.html?nama=Budi&nim=119140001&email=budi@mail.com&telepon=0812...&jurusan=Teknik+Informatika&gender=L
      -->
      <form action="detail.html" method="GET">

        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap">

        <label for="nim">NIM</label>
        <input type="text" id="nim" name="nim" placeholder="Contoh: 119140001">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="nama@email.com">

        <label for="telepon">No. Telepon</label>
        <input type="tel" id="telepon" name="telepon" placeholder="08xxxxxxxxxx">

        <label for="jurusan">Program Studi</label>
        <select id="jurusan" name="jurusan">
          <option value="Teknik Informatika">Teknik Informatika</option>
          <option value="Sistem Informasi">Sistem Informasi</option>
          <option value="Teknik Elektro">Teknik Elektro</option>
        </select>

        <label>Jenis Kelamin</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Laki-laki"> Laki-laki</label>
          <label><input type="radio" name="gender" value="Perempuan"> Perempuan</label>
        </div>

        <button type="submit" id="btn-daftar">Daftar</button>
      </form>
    </div>
  </div>

  <footer>&copy; 2026 - Tugas Pemweb</footer>

</body>
</html>
